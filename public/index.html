<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whodunit — Anonymous Ping Service</title>
  <meta name="description" content="Somebody pinged you. Nobody knows who. A tiny, portable, privacy-first anonymous ping engine." />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrapper {
      width: 100%;
      max-width: 540px;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 1rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow:
        0 20px 40px -15px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      margin-bottom: 1.5rem;
    }

    .privacy-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .privacy-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .privacy-item svg {
      color: var(--emerald);
      flex-shrink: 0;
    }

    .footer {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }

    .footer a {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: #c7d2fe;
    }
  </style>

  <!-- Embed Whodunit Widget -->
  <script defer src="/widget.js"></script>
</head>
<body>
  <main class="wrapper">
    <div class="brand">
      <img src="/icon.png" alt="Whodunit logo" class="brand-icon" />
      <div class="badge">
        <span class="badge-dot"></span>
        Zero telemetry · 100% private
      </div>
      <h1>Whodunit</h1>
      <p class="tagline">Somebody pinged you. Nobody knows who.</p>
    </div>

    <section class="card">
      <whodunit-form
        endpoint="/ping"
        placeholder="Type a completely anonymous message..."
        button-text="Send Ping"
        max-length="500"
      ></whodunit-form>

      <div class="privacy-list">
        <div class="privacy-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          <span>No IP retention</span>
        </div>
        <div class="privacy-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          <span>Zero logs saved</span>
        </div>
        <div class="privacy-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          <span>Daily salt rotation</span>
        </div>
        <div class="privacy-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          <span>Open source & auditable</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      Powered by <a href="https://github.com/BeeBombshell/whodunit-ping" target="_blank" rel="noopener">Whodunit</a>.
      Self-host your own in under 10 minutes.
    </footer>
  </main>
</body>
</html>
