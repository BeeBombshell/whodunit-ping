<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Whodunit: Somebody pinged you. Nobody knows who.">
  <defs>
    <!-- Hazard tape pattern -->
    <pattern id="hazardStripe" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="32" fill="#ffd60a"/>
      <rect x="16" width="16" height="32" fill="#15181c"/>
    </pattern>

    <!-- Subtle desk height chart lines -->
    <pattern id="deskGrid" width="100" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="47" x2="100" y2="47" stroke="#15181c" stroke-width="1.2" stroke-opacity="0.07"/>
    </pattern>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <style>
      .font-display { font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .font-mono { font-family: 'Courier Prime', ui-monospace, SFMono-Regular, monospace; }
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background: Paper tone with faint detective lineup grid -->
  <rect width="1280" height="640" fill="#e8eaec"/>
  <rect width="1280" height="640" fill="url(#deskGrid)"/>

  <!-- Top Hazard Tape Strip -->
  <rect width="1280" height="16" fill="url(#hazardStripe)"/>
  <line x1="0" y1="16" x2="1280" y2="16" stroke="#15181c" stroke-width="2"/>

  <!-- Bottom Hazard Accent Strip -->
  <rect y="626" width="1280" height="14" fill="url(#hazardStripe)"/>
  <line x1="0" y1="626" x2="1280" y2="626" stroke="#15181c" stroke-width="2"/>

  <!-- ========================================================================
       LEFT SIDE: Brand, Headlines, Privacy Tags, Specs
       ======================================================================== -->
  <g transform="translate(76, 56)">
    
    <!-- Case File Tag & Brand Wordmark -->
    <g transform="translate(0, 0)">
      <!-- Yellow Case Tag -->
      <g transform="translate(0, 0)">
        <rect width="168" height="28" fill="#ffd60a" stroke="#15181c" stroke-width="2"/>
        <text x="84" y="19" class="font-mono" font-size="12" font-weight="700" fill="#15181c" text-anchor="middle" letter-spacing="0.1em">CASE FILE #0417</text>
      </g>
      
      <!-- Wordmark -->
      <g transform="translate(186, 0)">
        <text x="0" y="24" class="font-display" font-size="32" fill="#15181c" letter-spacing="-0.02em">whodunit</text>
        <rect x="146" y="4" width="56" height="22" fill="#15181c" rx="2"/>
        <text x="174" y="19" class="font-mono" font-size="12" font-weight="700" fill="#ffd60a" text-anchor="middle">.ping</text>
      </g>
    </g>

    <!-- Main Headline -->
    <g transform="translate(0, 56)">
      <text x="0" y="48" class="font-display" font-size="52" fill="#15181c" letter-spacing="-0.03em">Somebody pinged you.</text>
      
      <!-- Line 2: Nobody (struck through) knows who (redacted) -->
      <g transform="translate(0, 114)">
        <text x="0" y="0" class="font-display" font-size="52" fill="#15181c" letter-spacing="-0.03em">Nobody</text>
        <!-- Red strike-through line -->
        <rect x="-4" y="-23" width="186" height="6" fill="#c8281e"/>

        <text x="202" y="0" class="font-display" font-size="52" fill="#15181c" letter-spacing="-0.03em">knows</text>

        <!-- Redaction bar on "who" -->
        <g transform="translate(362, -40)">
          <rect width="112" height="46" fill="#15181c" rx="1"/>
          <text x="56" y="33" class="font-display" font-size="52" fill="#e8eaec" letter-spacing="-0.03em" text-anchor="middle">who.</text>
        </g>
      </g>
    </g>

    <!-- Lede copy -->
    <g transform="translate(0, 236)">
      <text x="0" y="0" class="font-mono" font-size="17" fill="#4b535c">A tiny, self-hostable anonymous form.</text>
      <text x="0" y="26" class="font-mono" font-size="17" fill="#4b535c">A visitor writes a message, your phone buzzes.</text>
      <text x="0" y="54" class="font-mono" font-size="17" font-weight="700" fill="#15181c">No emails, accounts, cookies or IP addresses are collected.</text>
    </g>

    <!-- 4 Privacy Tags with Punched Holes -->
    <g transform="translate(0, 360)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0) rotate(-1)">
        <rect width="128" height="42" fill="#f7f7f5" stroke="#15181c" stroke-width="2"/>
        <circle cx="12" cy="21" r="5" fill="#e8eaec" stroke="#15181c" stroke-width="1.8"/>
        <text x="74" y="26" class="font-display" font-size="13" fill="#15181c" text-anchor="middle">Open source</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(140, 0) rotate(1)">
        <rect width="124" height="42" fill="#f7f7f5" stroke="#15181c" stroke-width="2"/>
        <circle cx="12" cy="21" r="5" fill="#e8eaec" stroke="#15181c" stroke-width="1.8"/>
        <text x="72" y="26" class="font-display" font-size="13" fill="#15181c" text-anchor="middle">Self-hosted</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(276, 0) rotate(-1)">
        <rect width="138" height="42" fill="#f7f7f5" stroke="#15181c" stroke-width="2"/>
        <circle cx="12" cy="21" r="5" fill="#e8eaec" stroke="#15181c" stroke-width="1.8"/>
        <text x="79" y="26" class="font-display" font-size="13" fill="#15181c" text-anchor="middle">Zero telemetry</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(426, 0) rotate(1)">
        <rect width="138" height="42" fill="#f7f7f5" stroke="#15181c" stroke-width="2"/>
        <circle cx="12" cy="21" r="5" fill="#e8eaec" stroke="#15181c" stroke-width="1.8"/>
        <text x="79" y="26" class="font-display" font-size="13" fill="#15181c" text-anchor="middle">No IP logging</text>
      </g>
    </g>

    <!-- Provider Badges Strip -->
    <g transform="translate(0, 442)">
      <rect width="564" height="38" fill="#f7f7f5" stroke="#15181c" stroke-width="2"/>
      <text x="18" y="24" class="font-mono" font-size="12" font-weight="700" fill="#4b535c">PROVIDERS:</text>
      <text x="108" y="24" class="font-mono" font-size="13" font-weight="700" fill="#15181c">ntfy.sh · Pushover · Telegram · Discord · Email</text>
    </g>

  </g>

  <!-- ========================================================================
       RIGHT SIDE: Detective Mascot & Case-File Desk
       ======================================================================== -->
  <g transform="translate(734, 46)">

    <!-- Tilted Yellow Evidence Board Backdrop -->
    <g transform="rotate(3) translate(34, 22)">
      <rect width="436" height="344" fill="#ffd60a" stroke="#15181c" stroke-width="2"/>
      <!-- Evidence Label -->
      <g transform="translate(230, -14)">
        <rect width="194" height="26" fill="#15181c"/>
        <text x="97" y="17" class="font-display" font-size="11" fill="#ffd60a" text-anchor="middle" letter-spacing="0.14em">EVIDENCE · DO NOT CROSS</text>
      </g>
    </g>

    <!-- Big Detective Mascot Peeking and Standing Proudly Behind the Card -->
    <g transform="translate(320, -14) rotate(6)">
      <!-- Mascot Starburst Body (110x110) -->
      <g transform="translate(55, 60)">
        <polygon points="
          0,-46 13,-17 44,-31 23,-2
          46,13 17,17 27,46 0,25
          -27,46 -17,17 -46,13 -23,-2
          -44,-31 -13,-17
        " fill="#ffd60a" stroke="#15181c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Eyes -->
        <circle cx="-10" cy="0" r="3.5" fill="#15181c"/>
        <circle cx="10" cy="0" r="3.5" fill="#15181c"/>
      </g>

      <!-- Detective Fedora Hat tilted atop mascot -->
      <g transform="translate(55, 26) rotate(-8)">
        <ellipse cx="0" cy="14" rx="44" ry="7.5" fill="#15181c" stroke="#15181c" stroke-width="2"/>
        <ellipse cx="0" cy="13" rx="42" ry="5.8" fill="#2a2e33"/>
        <!-- Hat Crown -->
        <path d="M-24,12 C-24,12 -26,-13 -17,-19 C-9,-25 0,-17 0,-17 C0,-17 9,-25 17,-19 C26,-13 24,12 24,12 Z" fill="#15181c"/>
        <!-- Crown indentation -->
        <path d="M-11,-13 C-4,-16 4,-16 11,-13" stroke="#2a2e33" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Yellow Ribbon Band -->
        <path d="M-23.8,7 C-13,8.5 13,8.5 23.8,7 L24,12 C13,13.5 -13,13.5 -24,12 Z" fill="#ffd60a"/>
      </g>

      <!-- Magnifying Glass held by mascot -->
      <g transform="translate(98, 70) rotate(24)">
        <circle cx="0" cy="0" r="14" fill="#e8eaec" fill-opacity="0.7" stroke="#15181c" stroke-width="3"/>
        <line x1="10" y1="10" x2="26" y2="26" stroke="#15181c" stroke-width="5" stroke-linecap="round"/>
        <circle cx="-4" cy="-4" r="3" fill="#ffffff" fill-opacity="0.8"/>
      </g>
    </g>

    <!-- Case File Card (Rotated -1.5deg) -->
    <g transform="rotate(-1.5) translate(0, 32)">
      <!-- Hard offset shadow -->
      <rect x="8" y="8" width="436" height="332" fill="#15181c"/>
      <!-- Main Card Surface -->
      <rect width="436" height="332" fill="#f7f7f5" stroke="#15181c" stroke-width="2"/>

      <!-- Paperclip top left -->
      <g transform="translate(24, -16)">
        <path d="M8,0 L8,44 A6,6 0 0,0 20,44 L20,10 A4,4 0 0,0 12,10 L12,38" fill="none" stroke="#15181c" stroke-width="3.2" stroke-linecap="round"/>
      </g>

      <!-- Case Number Header -->
      <text x="46" y="28" class="font-mono" font-size="12" font-weight="700" fill="#4b535c" letter-spacing="0.08em">CASE 0417</text>

      <!-- ANONYMOUS Stamp top-right -->
      <g transform="translate(296, 14) rotate(8)">
        <rect width="118" height="25" fill="none" stroke="#c8281e" stroke-width="3"/>
        <text x="59" y="18" class="font-display" font-size="14" fill="#c8281e" text-anchor="middle" letter-spacing="0.04em">ANONYMOUS</text>
      </g>

      <!-- Meta DL Rows -->
      <g transform="translate(28, 62)">
        <text x="0" y="0" class="font-mono" font-size="14" fill="#4b535c">To:</text>
        <text x="58" y="0" class="font-mono" font-size="14" font-weight="700" fill="#15181c">You</text>

        <text x="0" y="22" class="font-mono" font-size="14" fill="#4b535c">From:</text>
        <rect x="58" y="10" width="114" height="15" fill="#15181c" rx="1"/>
      </g>

      <!-- Dashed divider -->
      <line x1="28" y1="112" x2="408" y2="112" stroke="#4b535c" stroke-width="2" stroke-dasharray="6,4"/>

      <!-- Message Area -->
      <g transform="translate(28, 134)">
        <text x="0" y="0" class="font-mono" font-size="13" font-weight="700" fill="#15181c">Write a message</text>

        <!-- Message Box -->
        <rect x="0" y="12" width="380" height="96" fill="none" stroke="#15181c" stroke-width="2"/>
        <text x="14" y="38" class="font-mono" font-size="14" fill="#15181c">Loved your post on SQLite optimizations.</text>
        <text x="14" y="60" class="font-mono" font-size="14" fill="#15181c">Fixed a memory leak thanks to it.</text>

        <text x="0" y="132" class="font-mono" font-size="11" fill="#4b535c">Nothing about you is stored or sent along.</text>

        <!-- Primary Yellow Send Button with 2px hard shadow -->
        <g transform="translate(306, 114)">
          <rect x="3" y="3" width="74" height="28" fill="#15181c"/>
          <rect width="74" height="28" fill="#ffd60a" stroke="#15181c" stroke-width="2"/>
          <text x="37" y="18" class="font-mono" font-size="13" font-weight="700" fill="#15181c" text-anchor="middle">Send</text>
        </g>
      </g>

      <!-- DELIVERED Rubber Stamp (Tilted -12deg) -->
      <g transform="translate(216, 204) rotate(-12)">
        <rect x="-140" y="-32" width="280" height="64" fill="#f7f7f5" fill-opacity="0.9" stroke="#c8281e" stroke-width="5"/>
        <text x="0" y="14" class="font-display" font-size="44" fill="#c8281e" text-anchor="middle" letter-spacing="0.05em">DELIVERED</text>
      </g>
    </g>

    <!-- Phone Push Notification Toast (Arrived below card) -->
    <g transform="translate(10, 412)" filter="url(#softShadow)">
      <rect width="424" height="106" rx="18" fill="#202428" stroke="#15181c" stroke-width="2"/>

      <!-- Notification App Icon -->
      <g transform="translate(16, 18)">
        <rect width="38" height="38" rx="8" fill="#f7f7f5"/>
        <!-- Mini Mascot inside App Icon -->
        <g transform="translate(19, 23) scale(0.6)">
          <polygon points="0,-40 10,-14 38,-27 20,-2 40,11 15,15 24,40 0,22 -24,40 -15,15 -40,11 -20,-2 -38,-27 -10,-14" fill="#ffd60a" stroke="#15181c" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="-7" cy="0" r="2.8" fill="#15181c"/>
          <circle cx="7" cy="0" r="2.8" fill="#15181c"/>
        </g>
        <!-- Mini hat on icon -->
        <g transform="translate(19, 10) scale(0.6) rotate(-7)">
          <ellipse cx="0" cy="8" rx="20" ry="3.5" fill="#15181c"/>
          <path d="M-10,7 C-10,7 -11,-4 -8,-8 C-4,-11 0,-7 0,-7 C0,-7 4,-11 8,-8 C11,-4 10,7 10,7 Z" fill="#15181c"/>
          <path d="M-10,4 C-5,5 5,5 10,4 L10,7 C5,8 -5,8 -10,7 Z" fill="#ffd60a"/>
        </g>
      </g>

      <!-- Push Notification Text Content -->
      <g transform="translate(68, 20)">
        <text x="0" y="10" class="font-sans" font-size="12" fill="#aab1b8">Whodunit Ping · ntfy</text>
        <text x="338" y="10" class="font-sans" font-size="12" fill="#aab1b8" text-anchor="end">now</text>

        <text x="0" y="30" class="font-sans" font-size="14" font-weight="700" fill="#f1f3f4">New anonymous message</text>
        <text x="0" y="50" class="font-sans" font-size="13" fill="#f1f3f4">“Loved your post on SQLite optimizations...”</text>

        <g transform="translate(0, 68)">
          <text x="0" y="0" class="font-sans" font-size="11" fill="#aab1b8">Sender</text>
          <rect x="44" y="-9" width="56" height="9" fill="#4b535c" rx="1"/>
          <text x="106" y="0" class="font-sans" font-size="11" fill="#aab1b8">· no IP logged</text>
        </g>
      </g>
    </g>

  </g>
</svg>
