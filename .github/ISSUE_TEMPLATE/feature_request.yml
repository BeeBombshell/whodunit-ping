name: Feature Request
description: Suggest an idea or new provider for Whodunit
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use-case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed design or provider adapter.
    validations:
      required: true
